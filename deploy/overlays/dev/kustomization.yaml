apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-dev

resources:
  - ../../base
  - preview-service.yaml

configMapGenerator:
  - name: demo-config
    behavior: merge
    literals:
      - APP_ENV=dev

images:
  - name: ghcr.io/pranshu-raj/gitops-progressive-delivery
    newTag: main

patches:
  - path: bluegreen.yaml
    target:
      kind: Rollout
      name: demo
